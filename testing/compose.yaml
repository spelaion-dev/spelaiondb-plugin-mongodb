# The servers this plugin's tests run against.
#
# MongoDB 8.0, with a user `spelaion` (password `spelaion`) in `admin`, published on
# 127.0.0.1:27018 (SPELAION_TEST_MONGO).
#
# FerretDB 2, which speaks MongoDB's protocol in front of PostgreSQL with DocumentDB's
# extension, reached through this plugin as a kind of MongoDB connection (SpelaionDB's ADR-056),
# on 127.0.0.1:27019 (SPELAION_TEST_FERRETDB), same user and password. Its "eval" image carries
# its own PostgreSQL.
name: spelaiondb-plugin-mongodb-test

services:
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: spelaion
      MONGO_INITDB_ROOT_PASSWORD: spelaion
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 60

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb-eval:2
    environment:
      POSTGRES_USER: spelaion
      POSTGRES_PASSWORD: spelaion
    ports:
      - "127.0.0.1:27019:27017"
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferretdb", "ping"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 5s

  # A certificate for mongo.example.test only: the host is deliberately not resolvable.
  # The plugin must reach the supplied socket while checking this logical name.
  mongodb-tls:
    image: mongo:8.0
    command: ["mongod", "--bind_ip_all", "--replSet", "atlas-test", "--tlsMode", "requireTLS", "--tlsCertificateKeyFile", "/certs/server.pem", "--tlsCAFile", "/certs/ca.crt", "--tlsAllowConnectionsWithoutCertificates"]
    volumes:
      - ./tls/server.pem:/certs/server.pem:ro
      - ./tls/ca.crt:/certs/ca.crt:ro
    ports:
      - "127.0.0.1:27020:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--tls", "--tlsAllowInvalidCertificates", "--eval", "try { if (!rs.status().ok) quit(1); if (!db.hello().isWritablePrimary) quit(1); } catch (e) { rs.initiate({_id:'atlas-test',members:[{_id:0,host:'localhost:27017'}]}); quit(1); }"]
      interval: 2s
      timeout: 5s
      retries: 60
