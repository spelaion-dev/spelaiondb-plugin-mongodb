[package]
# The program's name, which is what SpelaionDB's plugins.toml pins.
name = "spelaiondb-plugin-mongodb"
description = "MongoDB for SpelaionDB, served as a plugin: MongoDB and the servers that speak its protocol"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/spelaion-dev/spelaiondb-plugin-mongodb"
publish = false

[lib]
name = "spelaion_driver_mongodb"

[[bin]]
name = "spelaiondb-plugin-mongodb"
path = "src/bin/spelaiondb-plugin-mongodb.rs"

# The contract and the plugin's side of the protocol come from SpelaionDB's repository, by tag
# (ADR-042): one tag pins them together. `plugin-sdk-v0.2.0` is the first with requests
# (protocol 1.1, ADR-056), which are what this plugin is sent.
[dependencies]
spelaion-driver-api = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.2.0" }
spelaion-plugin-sdk = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.2.0" }
# The same Arrow as SpelaionDB's: batches cross the two unchanged.
arrow = { version = "60", default-features = false, features = ["ipc"] }
async-trait = "0.1"
futures-util = "0.3"
# MongoDB's own driver. No DNS resolver (`mongodb+srv` would make the plugin find servers by
# itself: SpelaionDB's core opens every route), TLS with rustls.
mongodb = { version = "3", default-features = false, features = ["compat-3-0-0", "rustls-tls", "socks5-proxy"] }
getrandom = "0.3"
subtle = "2"
# Keys keep their order: a MongoDB command is named by its first key.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

[dev-dependencies]
# The conformance set every plugin runs against its own program (tests/conformance.rs).
spelaion-plugin-host = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.2.0" }

[lints.rust]
unsafe_code = "forbid"

# What ships is this program: small and without the debugger's tables.
[profile.release]
strip = "symbols"
